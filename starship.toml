# Starship prompt — clean, professional config
# Docs: https://starship.rs/config/

# Two-line prompt: info line, then a clean input caret on its own line.
add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# ── Directory ───────────────────────────────────────────────
[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " "

# ── Git ─────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ── Languages (shown only inside relevant projects) ─────────
[python]
symbol = " "
style = "bold yellow"
# Show interpreter + active virtualenv/pyenv name when relevant
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
format = "[$symbol$version]($style) "

[golang]
symbol = " "
format = "[$symbol$version]($style) "

# ── Misc ────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "bold dimmed white"
format = "[ $duration]($style) "

[character]
success_symbol = "[›](green)"
error_symbol = "[›](red)"
vicmd_symbol = "[‹](green)"
