# tmux config — managed in ~/code/jpalvarezb/dotfiles (symlinked to ~/.tmux.conf)
# Reload after edits:  prefix + r   (prefix is Ctrl-b by default)

# ── Colors / terminal ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# ── Quality of life ───────────────────────────────────────────
set -g mouse on                 # click panes, drag borders to resize, scroll
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -sg escape-time 10          # snappier ESC (better for vim/claude TUIs)
set -g history-limit 50000      # big scrollback

# ── Splits: | and - , open in the current pane's directory ────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── File explorer (yazi) — prefix + e ────────────────────────
bind e split-window -h -c "#{pane_current_path}" -l 40% "yazi"

# ── Reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── Resize panes with prefix + H/J/K/L (5 cells at a time) ──────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Move between panes with Alt+arrows (no prefix needed) ──────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Status bar — clean, minimal ───────────────────────────────
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]%H:%M #[fg=yellow]%d-%b "
set -g status-justify centre
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
