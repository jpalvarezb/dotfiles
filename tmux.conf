# tmux config — managed in ~/.dotfiles (symlinked to ~/.tmux.conf)
# Reload after edits:  prefix + r   (prefix is Ctrl-b)
# Theme: Brogrammer — same palette as ghostty/config, so terminal and tmux read as one piece.

# ── Colors / terminal ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# ── Quality of life ───────────────────────────────────────────
set -g mouse on                 # click panes, drag borders to resize, scroll
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -sg escape-time 10          # snappier ESC (better for vim/claude TUIs)
set -g history-limit 50000      # big scrollback
set -g allow-passthrough on     # let OSC 777 notifications reach Ghostty
set -g focus-events on          # editors get told when their pane gains focus
set -g detach-on-destroy off    # killing a session jumps to the next, not detach
set -g set-titles on            # window title flows up to Ghostty/AeroSpace
set -g set-titles-string "#S · #W"

# ── Copy → clipboard de macOS ─────────────────────────────────
set -g set-clipboard on         # OSC 52: tmux copy → system clipboard (Ghostty supports it)
# Belt and suspenders: pipe mouse-drag and keyboard copy straight to pbcopy
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"

# ── Windows & splits open in the current pane's directory ─────
bind c new-window   -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── File explorer (yazi) — prefix + e ─────────────────────────
bind e split-window -h -c "#{pane_current_path}" -l 40% "yazi"

# ── Popups ────────────────────────────────────────────────────
bind g display-popup -d "#{pane_current_path}" -w 80% -h 75% -E "zsh -i"   # scratch shell
bind f display-popup -w 60% -h 50% -E "$HOME/.dotfiles/bin/tmux-pick"      # fzf window picker
set -g popup-border-lines rounded
set -g popup-border-style "fg=#2a84d2"

# ── Reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── Resize panes with prefix + H/J/K/L (5 cells at a time) ────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Move between panes with Alt+arrows (no prefix needed) ─────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Panes — subtle borders, titles appear only when split ─────
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#2a84d2"
set -g pane-border-format " #{?pane_active,#[fg=#2a84d2#,bold],#[fg=#666c76]}#{pane_index} · #{pane_current_command} · #{b:pane_current_path} "
set-hook -g window-layout-changed 'set-option -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
bind T set -w pane-border-status   # manual toggle

# ── Status bar — Brogrammer pills on transparent background ───
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#d6dbe5"
set -g status-left-length 40
set -g status-right-length 120

# Session pill: blue, turns red while the prefix (Ctrl-b) is armed
set -g status-left "#[fg=#{?client_prefix,#f81118,#2a84d2}]#[fg=#131313,bg=#{?client_prefix,#f81118,#2a84d2},bold] #S #[fg=#{?client_prefix,#f81118,#2a84d2},bg=default]  "

# Window list: dim until active; active = yellow pill
set -g window-status-separator " "
set -g window-status-format "#[fg=#666c76] #I·#W#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=#ecba0f]#[fg=#131313,bg=#ecba0f,bold]#I·#W#{?window_zoomed_flag, ,}#[fg=#ecba0f,bg=default]"
set -g window-status-activity-style "fg=#f3bd09"
set -g window-status-bell-style "fg=#f81118"

# Right: cwd pill · git branch pill (hidden outside repos) · clock pill
set -g status-right "#[fg=#4e5ab7]#[fg=#ffffff,bg=#4e5ab7]  #{b:pane_current_path} #[fg=#4e5ab7,bg=default] #($HOME/.dotfiles/bin/tmux-git-seg '#{pane_current_path}')#[fg=#1081d6]#[fg=#131313,bg=#1081d6,bold] %H:%M #[fg=#1081d6,bg=default]"

# ── Modes & messages ──────────────────────────────────────────
set -g mode-style "fg=#131313,bg=#ecba0f"
set -g message-style "fg=#d6dbe5,bg=#1f1f1f"
set -g message-command-style "fg=#d6dbe5,bg=#1f1f1f"
set -g clock-mode-colour "#2a84d2"
